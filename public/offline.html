<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><title>Offline · DrukView</title>
<style>
:root{--maroon:#9f1239;--saffron:#f59e0b;--bg:#f6f6f8;--surface:#fff;--ink:#18181b;--muted:#5c5f66;--line:#e4e4e7}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0e;--surface:#16161b;--ink:#f4f4f5;--muted:#a1a1aa;--line:#2a2a31}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px 16px}
main{max-width:30rem;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
h1{font-size:1.3rem;margin:12px 0 8px}p{margin:0 0 12px;color:var(--muted)}
button{font:inherit;font-weight:600;color:#fff;background:var(--maroon);border:0;border-radius:10px;padding:12px 18px;min-height:44px;cursor:pointer}
</style></head>
<body><main>
<svg viewBox="0 0 32 32" width="44" height="44" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#9f1239"/><circle cx="16" cy="16" r="7" fill="none" stroke="#f59e0b" stroke-width="3"/></svg>
<h1>You are offline</h1>
<p>DrukView needs a connection to show figures. It does not show saved copies of pages, because a number with no date on it could be weeks old without you knowing.</p>
<p>Reconnect and try again.</p>
<button type="button" onclick="location.reload()">Try again</button>
</main></body></html>
