name: New data source
description: Propose a public source DrukView should publish
title: "Source: "
labels: [source]
body:
  - type: input
    id: publisher
    attributes:
      label: Publisher
      placeholder: Ministry of Infrastructure and Transport
    validations: { required: true }
  - type: input
    id: url
    attributes:
      label: Where it is published (https)
    validations: { required: true }
  - type: dropdown
    id: form
    attributes:
      label: What form is it in?
      options:
        - API or JSON
        - CSV or spreadsheet
        - RSS / Atom feed
        - HTML page
        - PDF only
        - Not sure
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What it would add, and down to what level (national, dzongkhag, gewog)
    validations: { required: true }
  - type: textarea
    id: caveats
    attributes:
      label: Known caveats
      description: Units, currency, how often it changes, whether its own totals add up.
