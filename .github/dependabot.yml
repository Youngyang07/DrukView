version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      # One pull request for the framework, one for everything else: fewer, more reviewable bumps.
      next:
        patterns: ['next', 'react', 'react-dom', '@types/react', '@types/react-dom']
      rest:
        patterns: ['*']
        exclude-patterns: ['next', 'react', 'react-dom', '@types/react', '@types/react-dom']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
