name: Refresh vacancies
# Every hour, ask the live site to re-read the two vacancy sources.
#
# Why GitHub Actions and not vercel.json: Vercel's Hobby plan runs a cron at most once a day, and a more
# frequent schedule there fails the deployment. The daily Vercel crons stay as a fallback.
#
# The jobs are public and rate-limited (at most once per 50 minutes each), so no secret is needed. If the
# repository secret CRON_SECRET is set, it is sent and lifts the limit; it is never printed.
#
# Each response is printed in the run log, and a job that fails turns the run red, so a collector that stops
# working is visible here instead of only on the Data sources page.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: refresh-vacancies
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE: ${{ vars.SITE_URL || 'https://drukview.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Run the rcsc and blmis jobs
        run: |
          fail=0
          for job in rcsc blmis; do
            auth=()
            if [ -n "$CRON_SECRET" ]; then auth=(-H "Authorization: Bearer $CRON_SECRET"); fi
            code=$(curl -sS -m 75 -o body.json -w '%{http_code}' "${auth[@]}" "$SITE/api/cron/$job") || code=000
            echo "::group::$job: HTTP $code"
            cat body.json 2>/dev/null; echo
            echo "::endgroup::"
            case "$code" in
              200) echo "$job: refreshed" ;;
              429) echo "$job: skipped, refreshed less than 50 minutes ago" ;;
              *)   echo "::error title=$job failed::HTTP $code from $SITE/api/cron/$job: $(head -c 400 body.json 2>/dev/null)"; fail=1 ;;
            esac
          done
          exit $fail
