name: CI
on:
  push: { branches: ['**'] }
  pull_request:
permissions: { contents: read }
# A new push supersedes an in-flight run on the same branch; main is never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    name: typecheck · test · build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]   # package.json engines: >=20; Vercel runs 22
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: drukview_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/drukview_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The data rules are only real if something checks them. These are cheap, repo-wide greps that catch the
  # mistakes review keeps having to catch: an uncited curated row, and a secret in the tree.
  data-rules:
    name: data rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Every curated CSV row cites an https document
        run: |
          fail=0
          for f in data/manual/*.csv; do
            python3 - "$f" <<'PY' || fail=1
          import csv, sys
          path = sys.argv[1]
          with open(path, newline='', encoding='utf-8') as fh:
              rows = list(csv.DictReader(fh))
          bad = []
          for i, r in enumerate(rows, start=2):
              url = (r.get('source_url') or r.get('url') or '').strip()
              if not (r.get('source_name') or '').strip():
                  bad.append(f'row {i}: no source_name')
              if not url.startswith('https://'):
                  bad.append(f'row {i}: source must be an https URL')
          for b in bad:
              print(f'{path}: {b}')
          sys.exit(1 if bad else 0)
          PY
          done
          exit $fail
      - name: No secrets committed
        run: |
          if grep -rInE '(CRON_SECRET|DATABASE_URL)[[:space:]]*=[[:space:]]*["'"'"']?[A-Za-z0-9+/_:@.-]{16,}' \
               --exclude-dir=node_modules --exclude-dir=.git --exclude='*.example' . ; then
            echo "A secret-looking value is committed. Rotate it and remove it from the tree."
            exit 1
          fi
          echo "none found"
