name: Update data
on:
  schedule: [{ cron: '17 2 * * *' }]   # daily, 02:17 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency: update-data
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run update
        env:
          ADB_IATI_URL: ${{ vars.ADB_IATI_URL }}
      - run: npm run validate
      - name: Commit changes
        run: |
          git config user.name "drukview-bot"; git config user.email "drukview-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "no changes" || (git commit -m "data: automated refresh $(date -u +%F)" && git push)
